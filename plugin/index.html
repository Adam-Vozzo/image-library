<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket</title>
<style>
  :root { --bg: #17171b; --panel: #22222a; --line: #33333d; --text: #f1f1f4; --dim: #9a9aa6; --accent: #5b9dff; }
  body.light { --bg: #f6f6f8; --panel: #fff; --line: #dcdce3; --text: #1a1a1f; --dim: #6b6b78; --accent: #2f6fe0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .dim { color: var(--dim); }
  .status { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e5a50a; flex: none; }
  .dot.ok { background: #3fb950; } .dot.bad { background: #f85149; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
  #qr { width: 232px; height: 232px; background: #fff; border-radius: 10px; padding: 10px; margin: 4px auto 12px; display: block; }
  #url { font: 12px ui-monospace, Consolas, monospace; color: var(--dim); word-break: break-all; user-select: all; }
  select, input, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 10px; }
  select, input { width: 100%; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row > * { flex: 1; }
  label { display: block; margin: 16px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  ol { margin: 14px 0 0; padding-left: 20px; color: var(--dim); }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
</style>
</head>
<body>
  <h1>Pocket</h1>
  <div class="dim">Your Eagle library on your phone</div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Starting…</span></div>

  <div class="card">
    <canvas id="qr" width="464" height="464"></canvas>
    <div id="url"></div>
    <div class="row">
      <button class="primary" id="copy">Copy link</button>
      <button id="rekey" title="Signs out every phone paired so far">New key</button>
    </div>
  </div>

  <label for="addr">Address the phone should use</label>
  <select id="addr"></select>
  <input id="custom" placeholder="https://my-pc.my-tailnet.ts.net" style="margin-top:8px" hidden>

  <ol>
    <li>Scan the code with your phone's camera while on the same Wi-Fi.</li>
    <li>Add the page to your home screen to use it like an app.</li>
    <li>Keep Eagle running on this PC. For access away from home, see the readme.</li>
  </ol>

  <script src="js/plugin.js"></script>
</body>
</html>
